document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h\">{{ s.line }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"position:absolute;right:0;top:clamp(28px,3vw,40px);color:#5A7290;font-size:1.2rem\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr);gap:clamp(14px,2vw,28px);padding-bottom:clamp(30px,3vw,44px)\">\n            <span><\u002Fspan>\n            <div>\n              <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px;max-width:72ch\">\n                <sc-for list=\"{{ s.bullets }}\" as=\"b\" hint-placeholder-count=\"6\">\n                  <li style=\"font-size:.98rem;line-height:1.6;color:#45607A;padding-left:18px;position:relative\"><span style=\"position:absolute;left:0;top:.66em;width:7px;height:1px;background:#9BB0C4\"><\u002Fspan>{{ b }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n              <p style=\"margin:26px 0 0;font-size:.95rem;line-height:1.6;color:#5A7290;max-width:66ch;border-left:2px solid #00D9A0;padding-left:16px\"><b style=\"color:#0B1F38;font-weight:600\">When you need it: <\u002Fb>{{ s.when }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n      <div style=\"border-top:1px solid #DEE7EF\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(50px,6vw,84px);display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n      <button sc-camel-on-click=\"{{ startAudit }}\" style=\"font:inherit;font-size:1rem;font-weight:600;color:#07152B;background:linear-gradient(180deg,#1BEFB5,#00C692);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 6px 18px rgba(0,217,160,.22);border:0;border-radius:4px;padding:18px 32px;cursor:pointer;transition:background .2s\" style-hover=\"background:linear-gradient(180deg,#48F8C8,#0AD9A3)\">Get your free IT audit<\u002Fbutton>\n      <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:1rem;font-weight:500;color:#0B1F38;border:1px solid #C9D7E3;border-radius:4px;padding:18px 30px\" style-hover=\"border-color:#07152B;color:#0B1F38\">Talk to an engineer<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ══════════════════ AUDIT FLOW ══════════════════ -->\n<sc-if value=\"{{ isAudit }}\">\n<main data-screen-label=\"Audit flow\" style=\"background:#07152B;color:#F7FAFC;min-height:100svh;display:flex;flex-direction:column;padding:clamp(110px,12vw,150px) clamp(20px,6vw,90px) clamp(60px,8vw,100px)\">\n  <div style=\"width:100%;max-width:880px;margin:0 auto;flex:1 1 auto;display:flex;flex-direction:column\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:clamp(36px,5vw,64px)\">\n      <div style=\"flex:1;max-width:340px\">\n        <span style=\"display:block;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.18em;color:rgba(247,250,252,.45);margin-bottom:9px\">{{ qModule }}<\u002Fspan>\n        <div style=\"height:2px;background:rgba(147,175,199,.22)\"><div style=\"height:100%;background:#00D9A0;transition:width .45s cubic-bezier(.2,.8,.2,1);width:{{ qPct }}\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"font:inherit;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.16em;color:rgba(247,250,252,.45);background:none;border:0;cursor:pointer\">EXIT<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 auto;display:flex;flex-direction:column;justify-content:center\">\n      <h2 style=\"margin:0;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.12;letter-spacing:-.035em;font-weight:600;max-width:20ch;text-wrap:balance\">{{ qAsk }}<\u002Fh2>\n      <sc-if value=\"{{ qWhy }}\">\n        <p style=\"margin:20px 0 0;max-width:56ch;font-size:1rem;line-height:1.62;color:rgba(247,250,252,.52);border-left:1px solid rgba(0,217,160,.5);padding-left:16px;text-wrap:pretty\">{{ qWhy }}<\u002Fp>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;gap:1px;margin-top:clamp(34px,4vw,54px);background:rgba(147,175,199,.18);grid-template-columns:{{ qCols }}\">\n        <sc-for list=\"{{ qOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;font:inherit;background:{{ o.bg }};border:0;padding:20px 22px;cursor:pointer;color:#F7FAFC;font-size:1.04rem;line-height:1.4;display:flex;align-items:center;gap:14px;transition:background .18s\" style-hover=\"background:#122A4E\">\n            <span style=\"flex:0 0 16px;height:16px;border-radius:2px;border:1px solid {{ o.dot }};background:{{ o.fill }}\"><\u002Fspan>{{ o.l }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ qMulti }}\">\n        <button sc-camel-on-click=\"{{ next }}\" style=\"align-self:flex-start;margin-top:26px;font:inherit;font-size:.98rem;font-weight:600;color:#07152B;background:linear-gradient(180deg,#1BEFB5,#00C692);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 6px 18px rgba(0,217,160,.22);border:0;border-radius:4px;padding:15px 30px;cursor:pointer\">Continue<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;align-items:center;gap:22px;margin-top:30px\">\n        <sc-if value=\"{{ canBack }}\">\n          <button sc-camel-on-click=\"{{ back }}\" style=\"font:inherit;font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.14em;color:rgba(247,250,252,.45);background:none;border:0;cursor:pointer\">← BACK<\u002Fbutton>\n        <\u002Fsc-if>\n        <span style=\"font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.14em;color:rgba(247,250,252,.3)\">{{ qCount }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:clamp(40px,5vw,70px) 0 0;font-size:.85rem;color:rgba(247,250,252,.35);max-width:60ch;line-height:1.6\">Everything you answer stays in this browser. Nothing is sent to a server, and no email is required to see your result.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ══════════════════ RESULTS ══════════════════ -->\n<sc-if value=\"{{ isResults }}\">\n<main data-screen-label=\"Results\" style=\"background:#F7FAFC;padding:clamp(120px,13vw,175px) clamp(20px,6vw,90px) clamp(80px,10vw,140px)\">\n  <div style=\"max-width:1500px;margin:0 auto\">\n    <span style=\"display:block;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.24em;color:#5A7290;margin-bottom:clamp(22px,3vw,34px)\">YOUR RESULT · {{ resDate }}<\u002Fspan>\n    <div data-resgrid=\"1\" style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(36px,5vw,80px);align-items:start\">\n      <div>\n        <h1 style=\"margin:0;font-size:clamp(2.2rem,4.4vw,4rem);line-height:1.04;letter-spacing:-.04em;font-weight:700;max-width:16ch;text-wrap:balance\">{{ resHead }}<\u002Fh1>\n        <p style=\"margin:26px 0 0;max-width:56ch;font-size:1.08rem;line-height:1.64;color:#45607A;text-wrap:pretty\">{{ resLine }}<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:clamp(30px,4vw,44px)\">\n          <a href=\"{{ waResHref }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:1rem;font-weight:600;color:#07152B;background:linear-gradient(180deg,#1BEFB5,#00C692);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 6px 18px rgba(0,217,160,.22);border-radius:4px;padding:17px 30px;white-space:nowrap\" style-hover=\"background:linear-gradient(180deg,#48F8C8,#0AD9A3);color:#07152B\">Review this with an engineer<\u002Fa>\n          <button sc-camel-on-click=\"{{ startAudit }}\" style=\"font:inherit;font-size:1rem;font-weight:500;color:#0B1F38;background:transparent;border:1px solid #C9D7E3;border-radius:4px;padding:17px 28px;white-space:nowrap;cursor:pointer\" style-hover=\"border-color:#07152B\">Run it again<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#07152B;color:#F7FAFC;border-radius:6px;padding:clamp(28px,3vw,44px);display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.2em;color:rgba(247,250,252,.45)\">EXPOSURE INDEX<\u002Fspan>\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-size:clamp(3.4rem,6vw,4.4rem);font-weight:700;letter-spacing:-.05em;line-height:1;color:{{ resTint }};font-variant-numeric:tabular-nums\">{{ resScore }}<\u002Fspan>\n          <span style=\"font-size:1.05rem;color:rgba(247,250,252,.45)\">/ 100<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:3px;background:rgba(147,175,199,.22)\"><div style=\"height:100%;background:{{ resTint }};width:{{ resPct }};transition:width .8s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0;font-size:.92rem;line-height:1.6;color:rgba(247,250,252,.55)\">Built from your own answers. Anything a browser cannot measure is labelled below, never counted as a failure.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"margin:clamp(60px,7vw,100px) 0 clamp(28px,3vw,42px);font-size:clamp(1.5rem,2.4vw,2.1rem);font-weight:600;letter-spacing:-.03em\">What we found<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:1px;background:#DEE7EF\">\n      <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"background:#F7FAFC;padding:clamp(26px,3vw,40px) 0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:clamp(14px,2vw,26px);align-items:start\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:.82rem;color:{{ f.tint }};padding-top:4px\">{{ f.n }}<\u002Fspan>\n          <div>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:12px\">\n              <h3 style=\"margin:0;font-size:clamp(1.1rem,1.6vw,1.34rem);font-weight:600;letter-spacing:-.02em;line-height:1.35\">{{ f.title }}<\u002Fh3>\n              <span style=\"font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.14em;white-space:nowrap;border:1px solid {{ f.chipBorder }};color:{{ f.tint }};background:{{ f.chipBg }};border-radius:999px;padding:3px 9px\">{{ f.ev }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 10px;font-size:1rem;line-height:1.62;color:#45607A;max-width:66ch;text-wrap:pretty\">{{ f.why }}<\u002Fp>\n            <p style=\"margin:0;font-size:.95rem;line-height:1.6;color:#0A6E58;max-width:66ch\"><b style=\"font-weight:600\">Fix: <\u002Fb>{{ f.fix }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(50px,6vw,84px);border-top:2px solid #07152B;padding-top:clamp(28px,3vw,40px);max-width:70ch\">\n      <h3 style=\"margin:0 0 14px;font-size:1.16rem;font-weight:600;letter-spacing:-.02em\">What this is, and is not<\u002Fh3>\n      <p style=\"margin:0;font-size:.98rem;line-height:1.66;color:#5A7290\">This is a snapshot built from the answers you gave, in your browser. It is not a penetration test and it is not an audit. An engineer reviewing your actual network will confirm, correct or close each point — which is exactly what the 15-minute review is for.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ══════════════════ HOW WE VERIFY ══════════════════ -->\n<sc-if value=\"{{ isTrust }}\">\n<main data-screen-label=\"How we verify\" style=\"background:#F7FAFC;padding:clamp(130px,14vw,190px) clamp(20px,6vw,90px) clamp(80px,10vw,140px)\">\n  <div style=\"max-width:1500px;margin:0 auto\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"font:inherit;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.16em;color:#5A7290;background:none;border:0;padding:0 0 clamp(24px,3vw,40px);cursor:pointer\">← BACK TO HOME<\u002Fbutton>\n    <h1 style=\"margin:0;font-size:clamp(2.6rem,5.4vw,5rem);line-height:1;letter-spacing:-.045em;font-weight:700;max-width:16ch;text-wrap:balance\">We only say what we actually know.<\u002Fh1>\n    <p style=\"margin:30px 0 clamp(50px,6vw,84px);max-width:62ch;font-size:1.12rem;line-height:1.62;color:#45607A;text-wrap:pretty\">Every line in an IT check report carries an evidence label. Nothing is presented as fact because it sounded convincing — each finding says exactly how we came to know it.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:1px;background:#DEE7EF;max-width:900px\">\n      <sc-for list=\"{{ evidence }}\" as=\"e\" hint-placeholder-count=\"4\">\n        <div style=\"background:#F7FAFC;padding:clamp(26px,3vw,38px) 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:clamp(16px,2vw,32px);align-items:start\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.14em;white-space:nowrap;border:1px solid {{ e.border }};color:{{ e.tint }};background:{{ e.bg }};border-radius:999px;padding:4px 10px;justify-self:start\">{{ e.k }}<\u002Fspan>\n          <p style=\"margin:0;font-size:1.02rem;line-height:1.64;color:#45607A;max-width:60ch;text-wrap:pretty\">{{ e.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(50px,6vw,84px);border-top:2px solid #07152B;padding-top:clamp(28px,3vw,40px);max-width:70ch\">\n      <h2 style=\"margin:0 0 14px;font-size:1.2rem;font-weight:600;letter-spacing:-.02em\">No fake score, no fake loading, no fake urgency.<\u002Fh2>\n      <p style=\"margin:0;font-size:1rem;line-height:1.66;color:#5A7290\">Only the urgency that is real: configurations keep changing, so every report is a dated snapshot. An older report should be re-checked before it is relied on.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(40px,5vw,64px);display:flex;flex-wrap:wrap;gap:16px\">\n      <button sc-camel-on-click=\"{{ startAudit }}\" style=\"font:inherit;font-size:1rem;font-weight:600;color:#07152B;background:linear-gradient(180deg,#1BEFB5,#00C692);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 6px 18px rgba(0,217,160,.22);border:0;border-radius:4px;padding:18px 32px;cursor:pointer;white-space:nowrap;transition:background .2s\" style-hover=\"background:linear-gradient(180deg,#48F8C8,#0AD9A3)\">Get your free IT audit<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goPrivacy }}\" style=\"font:inherit;font-size:1rem;font-weight:500;color:#0B1F38;background:transparent;border:1px solid #C9D7E3;border-radius:4px;padding:18px 30px;cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#07152B\">Data &amp; privacy<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ══════════════════ DATA & PRIVACY ══════════════════ -->\n<sc-if value=\"{{ isPrivacy }}\">\n<main data-screen-label=\"Data and privacy\" style=\"background:#F7FAFC;padding:clamp(130px,14vw,190px) clamp(20px,6vw,90px) clamp(80px,10vw,140px)\">\n  <div style=\"max-width:1500px;margin:0 auto\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"font:inherit;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.16em;color:#5A7290;background:none;border:0;padding:0 0 clamp(24px,3vw,40px);cursor:pointer\">← BACK TO HOME<\u002Fbutton>\n    <h1 style=\"margin:0;font-size:clamp(2.6rem,5.4vw,5rem);line-height:1;letter-spacing:-.045em;font-weight:700;max-width:14ch;text-wrap:balance\">Data &amp; privacy<\u002Fh1>\n    <p style=\"margin:30px 0 clamp(50px,6vw,84px);max-width:62ch;font-size:1.12rem;line-height:1.62;color:#45607A;text-wrap:pretty\">Short version: the IT check runs entirely in your browser. There is no account, no server database, no analytics and no tracker.<\u002Fp>\n\n    <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px;background:#DEE7EF;max-width:900px\">\n      <sc-for list=\"{{ privacyItems }}\" as=\"p\" hint-placeholder-count=\"5\">\n        <li style=\"background:#F7FAFC;padding:clamp(26px,3vw,38px) 0;display:grid;grid-template-columns:56px minmax(0,1fr);gap:clamp(14px,2vw,26px);align-items:start\">\n          <span style=\"font-family:'DM Mono',monospace;font-size:.82rem;color:#5A7290;padding-top:3px\">{{ p.n }}<\u002Fspan>\n          <div>\n            <h2 style=\"margin:0 0 10px;font-size:1.14rem;font-weight:600;letter-spacing:-.02em;line-height:1.35\">{{ p.t }}<\u002Fh2>\n            <p style=\"margin:0;font-size:1rem;line-height:1.64;color:#5A7290;max-width:62ch;text-wrap:pretty\">{{ p.d }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n\n    <div style=\"margin-top:clamp(50px,6vw,84px);border-top:2px solid #07152B;padding-top:clamp(28px,3vw,40px);max-width:70ch\">\n      <h2 style=\"margin:0 0 14px;font-size:1.2rem;font-weight:600;letter-spacing:-.02em\">Questions about your data<\u002Fh2>\n      <p style=\"margin:0;font-size:1rem;line-height:1.66;color:#5A7290\">Write to <a href=\"mailto:Support@puretechs.in\">Support@puretechs.in<\u002Fa> and an engineer will answer — not a form response.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- FOOTER -->\n<sc-if value=\"{{ showFooter }}\" hint-placeholder-val=\"{{ true }}\">\n<footer style=\"background:#07152B;color:#F7FAFC;padding:clamp(70px,9vw,120px) clamp(20px,6vw,90px) 40px;border-top:1px solid rgba(147,175,199,.16)\">\n  <div style=\"max-width:1500px;margin:0 auto\">\n    <div data-footgrid=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:clamp(32px,4vw,60px)\">\n      <div style=\"grid-column:span 2;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:18px\">\n          <svg sc-camel-view-box=\"0 0 64 64\" width=\"30\" height=\"30\" aria-hidden=\"true\"><path d=\"M14 54V12H42V32H26\" fill=\"none\" stroke=\"#F7FAFC\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"14\" cy=\"12\" r=\"5\" fill=\"#F7FAFC\"><\u002Fcircle><circle cx=\"42\" cy=\"12\" r=\"5\" fill=\"#F7FAFC\"><\u002Fcircle><circle cx=\"42\" cy=\"32\" r=\"5\" fill=\"#F7FAFC\"><\u002Fcircle><circle cx=\"26\" cy=\"32\" r=\"5\" fill=\"#F7FAFC\"><\u002Fcircle><circle cx=\"14\" cy=\"54\" r=\"7\" fill=\"#00D9A0\"><\u002Fcircle><\u002Fsvg>\n          <span style=\"font-weight:700;font-size:1.1rem;letter-spacing:-.03em\">Pure<span style=\"font-weight:500\">Techs<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 22px;font-size:.98rem;line-height:1.62;color:rgba(247,250,252,.55);max-width:38ch\">We run your IT, automate the manual work, and build the systems that don't exist off the shelf.<\u002Fp>\n        <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;font-size:.95rem;color:rgba(247,250,252,.75);margin-bottom:6px\" style-hover=\"color:#00D9A0\">+91 99296 12416<\u002Fa>\n        <a href=\"mailto:Support@puretechs.in\" style=\"display:block;font-size:.95rem;color:rgba(247,250,252,.75)\" style-hover=\"color:#00D9A0\">Support@puretechs.in<\u002Fa>\n      <\u002Fdiv>\n      <nav style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;color:rgba(247,250,252,.35);margin-bottom:6px\">COMPANY<\u002Fspan>\n        <a href=\"#about\" sc-camel-on-click=\"{{ jump }}\" data-to=\"about\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">About<\u002Fa>\n        <a href=\"#hiw\" sc-camel-on-click=\"{{ jump }}\" data-to=\"hiw\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">How it works<\u002Fa>\n        <a href=\"#industries\" sc-camel-on-click=\"{{ jump }}\" data-to=\"industries\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">Who we serve<\u002Fa>\n        <a href=\"#setups\" sc-camel-on-click=\"{{ jump }}\" data-to=\"setups\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">Setups we deploy<\u002Fa>\n        <a href=\"#faq\" sc-camel-on-click=\"{{ jump }}\" data-to=\"faq\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">FAQ<\u002Fa>\n      <\u002Fnav>\n      <nav style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;color:rgba(247,250,252,.35);margin-bottom:6px\">SERVICES<\u002Fspan>\n        <a href=\"#ai\" sc-camel-on-click=\"{{ jump }}\" data-to=\"ai\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">AI agents &amp; automation<\u002Fa>\n        <a href=\"#services\" sc-camel-on-click=\"{{ goServices }}\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">Network &amp; firewall<\u002Fa>\n        <a href=\"#amc\" sc-camel-on-click=\"{{ jump }}\" data-to=\"amc\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">Support &amp; AMC<\u002Fa>\n        <a href=\"#services\" sc-camel-on-click=\"{{ goServices }}\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">VAPT &amp; compliance<\u002Fa>\n        <a href=\"#services\" sc-camel-on-click=\"{{ goServices }}\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">Custom software<\u002Fa>\n      <\u002Fnav>\n      <nav style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;color:rgba(247,250,252,.35);margin-bottom:6px\">TRUST<\u002Fspan>\n        <button sc-camel-on-click=\"{{ startAudit }}\" style=\"font:inherit;text-align:left;font-size:.94rem;color:rgba(247,250,252,.66);background:none;border:0;padding:0;cursor:pointer\" style-hover=\"color:#F7FAFC\">Free IT audit<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goTrust }}\" style=\"font:inherit;text-align:left;font-size:.94rem;color:rgba(247,250,252,.66);background:none;border:0;padding:0;cursor:pointer\" style-hover=\"color:#F7FAFC\">How we verify<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goPrivacy }}\" style=\"font:inherit;text-align:left;font-size:.94rem;color:rgba(247,250,252,.66);background:none;border:0;padding:0;cursor:pointer\" style-hover=\"color:#F7FAFC\">Data &amp; privacy<\u002Fbutton>\n        <a href=\"#contact\" sc-camel-on-click=\"{{ jump }}\" data-to=\"contact\" style=\"font-size:.94rem;color:rgba(247,250,252,.66)\" style-hover=\"color:#F7FAFC\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(50px,6vw,86px);padding-top:26px;border-top:1px solid rgba(147,175,199,.16);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:.84rem;color:rgba(247,250,252,.4)\">\n      <span>© 2026 PureTechs · India-based, Mumbai HQ<\u002Fspan>\n      <span>Checks run in your browser. Only public records are read — no tracker.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fsc-if>\n\n<a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Chat on WhatsApp\" style=\"position:fixed;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);z-index:70;width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#1BEFB5,#00C692);box-shadow:inset 0 1px 0 rgba(255,255,255,.42);color:#07152B;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,217,160,.3);transition:transform .2s\" style-hover=\"transform:scale(1.06);color:#07152B\">\n  <svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 2a10 10 0 0 0-8.66 15L2 22l5.16-1.32A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.06.79.82-2.99-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.13c-.25-.13-1.46-.72-1.69-.8-.22-.08-.39-.13-.55.12-.17.25-.64.8-.78.97-.14.16-.29.18-.53.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.22-1.45-1.37-1.7-.14-.24-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.42-.55-.42h-.47c-.16 0-.43.06-.66.31-.22.25-.86.84-.86 2.05 0 1.21.88 2.38 1 2.55.13.16 1.74 2.65 4.2 3.72.59.25 1.05.4 1.4.52.59.19 1.13.16 1.55.1.47-.07 1.46-.6 1.66-1.18.2-.57.2-1.06.15-1.17-.06-.1-.23-.16-.47-.28Z\"><\u002Fpath><\u002Fsvg>\n<\u002Fa>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cinematic&quot;,&quot;measured&quot;,&quot;still&quot;],&quot;default&quot;:&quot;cinematic&quot;,&quot;tsType&quot;:&quot;'cinematic'|'measured'|'still'&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showTerminalRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;auditLength&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;min&quot;:4,&quot;max&quot;:16,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Free IT audit&quot;}}\">\nconst WA = '919929612416';\nconst wa = (t) => 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t);\n\nconst MARQUEE = ['Network architecture & design','Annual Maintenance Contracts','Hardware firewall & VPN','AI agents & chatbots','WhatsApp automation','VAPT & security testing','Server & Tally environment','Tally on Cloud','Backup + tested restore','Microsoft 365 / Google Workspace','Email security (SPF/DKIM/DMARC)','CCTV & biometric','Structured cabling','Workflow automation','AI document reading','Websites & web apps','Android & iOS apps','Custom business software','Tally / ERP integrations','Cloud backup & DR','Managed IT support'];\n\nconst PROBES = [\n  { id:'p1', w:22, label:'A restore from backup has never actually been tested.' },\n  { id:'p2', w:20, label:'We run on a plain router, not a business firewall.' },\n  { id:'p3', w:18, label:'The same password is shared across several people.' },\n  { id:'p4', w:20, label:'Nobody could produce a security or VAPT report today.' },\n  { id:'p5', w:20, label:'Business email still lives in one local Outlook file that is never backed up.' },\n];\n\nconst QUESTIONS = [\n  { id:'incidents', mod:'IMPACT', ask:'In the last year, what has IT actually stopped?',\n    why:'We start here, not with technical checkboxes — the real picture is what has actually broken, not what could theoretically go wrong.',\n    multi:true, cols:2, opts:[['server','Server or network down'],['email','Internet or email outage'],['malware','Virus or malware on PCs'],['printer','Printer or scanner down'],['dataloss','Data lost or a file corrupted'],['none','Nothing has stopped']] },\n  { id:'dependency', mod:'IMPACT', ask:'If that keeps happening — what actually stops in the business?',\n    why:'This is the most direct way to see what your business actually stands on.',\n    multi:true, cols:2, opts:[['billing','Billing / dispatch'],['accounts','Accounts / payments'],['sales','Sales / customer support'],['all','All work stops'],['none','Nothing stops']] },\n  { id:'continuity', mod:'IMPACT', ask:'When it happens, is there any fallback?',\n    why:'This is what separates an inconvenience from a shutdown.',\n    cols:1, opts:[['manual','Yes — a manual process we switch to'],['altmachine','Yes — we work on another machine'],['callit','We call IT or a vendor and wait'],['none','No plan — we just wait it out']] },\n  { id:'monitoring', mod:'MANAGED IT', ask:'Is your IT proactively monitored, or do you find out only when something breaks?',\n    why:'This is the difference between catching a failing disk before it fails, and finding out when the server does not turn on.',\n    cols:1, opts:[['monitored','Yes — monitored, with alerts before failure'],['reactive','No — we find out when it breaks'],['unsure','Not sure']] },\n  { id:'maintenance', mod:'MANAGED IT', ask:'Does anyone do scheduled preventive maintenance — updates, patching, health checks — on your systems?',\n    why:'Skipped patches and ignored warnings are how small issues turn into a Monday morning outage.',\n    cols:1, opts:[['scheduled','Yes, on a set schedule'],['reactive','Only when there is a problem'],['never','Never'],['unsure','Not sure']] },\n  { id:'email', mod:'EMAIL & CLOUD', ask:'Where does your business email actually live?',\n    why:'This single answer tells us more about your real risk than almost anything else we could ask.',\n    cols:1, opts:[['google','Google Workspace'],['ms365','Microsoft 365'],['cpanel','cPanel / hosted webmail (POP3 or IMAP)'],['personal','Free personal Gmail or a mixed setup'],['unsure','Not sure']] },\n  { id:'licensing', mod:'LICENSING', ask:'Does every user have the same email or Office plan, regardless of role?',\n    why:'Paying one price for everyone usually means paying for capability most users never touch.',\n    cols:1, opts:[['same','Yes, everyone is on the same plan'],['varies','No, it varies by role'],['unsure','Not sure — never checked']] },\n  { id:'genericmail', mod:'LICENSING', ask:'How many role-based addresses — info@, sales@, support@, accounts@ — have their own separate paid mailbox?',\n    why:'These almost never need to be full paid seats. Most business email platforms let you create them as free aliases or a shared mailbox under a licence you already pay for.',\n    cols:1, opts:[['none','None — we do not use role addresses'],['few','One or two'],['several','Three or more'],['unsure','Not sure']] },\n  { id:'unused', mod:'LICENSING', ask:'Are any paid email or Office licences sitting on accounts that have left, or are barely used?',\n    why:'A licence nobody reviews is a fixed cost that quietly renews every month, whether anyone is using it or not.',\n    cols:1, opts:[['yes','Yes, at least one'],['no','No, we keep it clean'],['unsure','Not sure']] },\n  { id:'mfa', mod:'ACCESS', ask:'Is 2-step verification on for business email?',\n    why:'Email is the single most common way in. MFA closes that door for almost nothing.',\n    cols:1, opts:[['on','On for everyone'],['some','On for some accounts'],['off','Off'],['unknown','Not sure']] },\n  { id:'exits', mod:'ACCESS', ask:'When someone leaves, is their access revoked the same week?',\n    why:'Email, Tally, CCTV, WhatsApp groups — any login still alive can still get in.',\n    cols:1, opts:[['yes','Yes, there is a checklist'],['sometimes','Sometimes, informally'],['no','No process for it'],['unknown','Not sure']] },\n  { id:'backup', mod:'BACKUP & RECOVERY', ask:'When was a restore from backup last tested?',\n    why:'\"Backup is running\" and \"restore works\" are two different facts. Only one of them saves you.',\n    cols:1, opts:[['recent','In the last three months'],['old','More than a year ago'],['never','Never tested'],['unknown','I do not know']] },\n  { id:'firewall', mod:'NETWORK', ask:'What sits between your office and the internet?',\n    why:'A home router and a business firewall are not the same thing. The gap shows up on the day you get hit.',\n    cols:1, opts:[['firewall','A business hardware firewall'],['router','The ISP router only'],['unknown','Not sure what is installed']] },\n  { id:'costItems', mod:'COST', ask:'Which IT costs do you currently pay for?',\n    why:'Most businesses can name two or three. Seeing the full list side by side is usually the first surprise.',\n    multi:true, cols:2, opts:[['ms','Microsoft licences'],['gw','Google Workspace'],['emailhost','Email hosting'],['dns','Domain / DNS'],['av','Antivirus / EDR'],['fw','Firewall / security subscriptions'],['backup','Backup'],['cloud','Cloud storage'],['servers','Servers'],['internet','Internet'],['amc','AMC'],['callsupport','Call-basis support'],['swlic','Software licences'],['erp','Tally / ERP'],['mssub','Microsoft / Google subscriptions'],['saas','Other SaaS'],['dontknow','Do not know']] },\n  { id:'spendKnown', mod:'COST', ask:'Do you know approximately how much you spend on IT subscriptions every month?',\n    why:'Not a trick question — most owners have never added it up across every vendor and card.',\n    cols:1, opts:[['yes','Yes'],['roughly','Roughly'],['no','No']] },\n  { id:'costReview', mod:'COST', ask:'How often is this reviewed against actual usage?',\n    why:'A subscription nobody re-checks keeps renewing at full price whether it is still needed or not.',\n    cols:1, opts:[['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly'],['renewal','Only during renewal'],['never','Never'],['dontknow','Do not know']] },\n];\n\nconst RULES = [\n  { when:(a)=>a.continuity==='none', sev:'risk',\n    title:'There is no fallback when core systems fail',\n    why:'No manual process, no spare machine, nobody to call — when the system stops, the business stops with it, for as long as the fix takes.',\n    fix:'A written fallback for each critical system, even a manual paper process, buys time while the real fix happens.' },\n  { when:(a)=>a.email==='cpanel', sev:'risk',\n    title:'Email lives in a single local file that can corrupt without warning',\n    why:'On POP3 / IMAP hosted mail, years of business communication often sit in one local .pst file. Once that file corrupts or the drive fails, recovery is expensive and never guaranteed.',\n    fix:'Move to a hosted mailbox (Google Workspace or Microsoft 365) so mail lives in the cloud, not on one hard drive.' },\n  { when:(a)=>a.email==='personal', sev:'risk',\n    title:'Business email runs on a personal account',\n    why:'A personal Gmail or shared free inbox has no admin control — nobody can revoke access, recover a deleted mail, or prove who sent what after someone leaves.',\n    fix:'Move to a business mailbox on your own domain, with one admin who can manage access centrally.' },\n  { when:(a)=>['never','unknown','old'].includes(a.backup), sev:'risk',\n    title:'Backup exists, but a restore has never been proven',\n    why:'A backup you have never restored from is a belief, not a control. The first time it is tested should not be the morning after a ransomware attack.',\n    fix:'A documented restore drill — and a monthly tested restore from then on.' },\n  { when:(a)=>['router','unknown'].includes(a.firewall), sev:'risk',\n    title:'The office runs behind an ISP router, not a firewall',\n    why:'There is no segmentation, no inspection and no logging. Guest devices, CCTV and your server share one flat network.',\n    fix:'A business hardware firewall with VLAN segmentation and a documented rule set.' },\n  { when:(a)=>['off','some','unknown'].includes(a.mfa), sev:'risk',\n    title:'2-step verification is not on for every mailbox',\n    why:'Business email compromise starts with one reused password. MFA is the single highest-return control available to you.',\n    fix:'MFA enforced on every mailbox, with break-glass admin accounts documented.' },\n  { when:(a)=>a.licensing==='same', sev:'attn',\n    title:'Every user is on the same licence tier, regardless of role',\n    why:'Frontline or field staff who only check mail rarely need the same paid tier as accounts or management. One price for everyone usually means paying for capability most users never touch — and it compounds every month, on every seat, for as long as it goes unreviewed.',\n    fix:'Split licences by actual usage: a lighter, browser-only plan for staff who just check mail, and the full desktop-app tier only for the users who actually open Word, Excel or Outlook daily. This is usually the single fastest licensing saving available, and it needs no new hardware or downtime to apply.' },\n  { when:(a)=>['few','several'].includes(a.genericmail), sev:'attn',\n    title:'Role-based inboxes may be paid seats that do not need to be',\n    why:'Addresses like info@, sales@ or accounts@ are usually read by two or three people, not logged into as their own account. If each one has its own full mailbox licence, you are paying seat-price for what is really just a shared inbox.',\n    fix:'Convert each role address into a free alias or a shared mailbox under a licence you already hold, and keep a dedicated paid seat only where someone genuinely needs to send, sort and reply from it independently.' },\n  { when:(a)=>a.unused==='yes', sev:'attn',\n    title:'Paid licences are sitting on accounts nobody actively uses',\n    why:'A seat tied to someone who has left, or who rarely logs in, keeps renewing at full price every month with nobody reviewing it — and it is also an access risk, not just a cost one.',\n    fix:'A quarterly licence review — cancel or reassign every seat tied to someone who has left, downgrade anything barely used.' },\n  { when:(a)=>['no','sometimes','unknown'].includes(a.exits), sev:'attn',\n    title:'Departed staff access is not revoked to a checklist',\n    why:'Every account left alive is a door. This one does not need a budget — it needs a written process.',\n    fix:'A joiner/mover/leaver checklist covering email, Tally, CCTV and WhatsApp groups.' },\n  { when:(a)=>Array.isArray(a.dependency) && (a.dependency.includes('all') || a.dependency.length>=2), sev:'attn',\n    title:'More than one core workflow depends on a single point of failure',\n    why:'You reported that more than one workflow stops on the same failure. That is a single point of failure carrying the revenue line.',\n    fix:'Server redundancy or a warm standby, with the recovery time agreed in writing.' },\n  { when:(a)=>a.monitoring==='reactive', sev:'attn',\n    title:'IT problems are found only after they happen',\n    why:'Without monitoring, a failing disk, a filling mail queue or a dying UPS gives no warning — the first sign of trouble is the system going down.',\n    fix:'Proactive monitoring with alerts before failure, so issues are caught on a dashboard, not by a phone call from an angry team.' },\n  { when:(a)=>['reactive','never'].includes(a.maintenance), sev:'attn',\n    title:'No scheduled preventive maintenance',\n    why:'Patches, updates and health checks that only happen after something breaks mean small, cheap fixes are routinely left to become outages.',\n    fix:'A maintenance calendar — patching, updates and health checks on a fixed schedule, not a reaction.' },\n  { when:(a)=>['renewal','never','dontknow'].includes(a.costReview), sev:'attn',\n    title:'IT spend is not reviewed against actual usage',\n    why:'Your answers indicate that IT spend is not currently being reviewed against actual usage on a regular basis.',\n    fix:'A quarterly line-by-line review of every subscription against who is actually using it — the same review that surfaced the licensing gaps above.' },\n];\n\nconst SEV = {\n  risk:{ tint:'#B8342A', ev:'SELF-REPORTED', chipBg:'#FDEBE8', chipBorder:'#EFBEB8', pts:16 },\n  attn:{ tint:'#96650A', ev:'SELF-REPORTED', chipBg:'#FDF4E2', chipBorder:'#E7C68C', pts:9 },\n  unk: { tint:'#5A7290', ev:'CANNOT VERIFY', chipBg:'#EEF3F8', chipBorder:'#D5E0EA', pts:0 },\n};\n\nconst ROI = [\n  { key:'q', label:'Customer queries on WhatsApp/phone', def:25, opts:[[0,'Hardly any'],[10,'~10 a day'],[25,'~25 a day'],[50,'~50 a day'],[100,'100+ a day']] },\n  { key:'d', label:'Manual data entry (Tally / Excel)', def:1, opts:[[0,'None'],[0.5,'~30 min a day'],[1,'~1 hour a day'],[2,'~2 hours a day'],[4,'4+ hours a day']] },\n  { key:'f', label:'Quotation & payment follow-ups', def:10, opts:[[0,'Rarely'],[10,'~10 a week'],[25,'~25 a week'],[50,'50+ a week']] },\n  { key:'s', label:'Average staff salary', def:22000, opts:[[15000,'~₹15,000 / month'],[22000,'~₹22,000 / month'],[30000,'~₹30,000 / month'],[45000,'₹45,000+ / month']] },\n];\n\nclass Component extends DCLogic {\n  state = {\n    view: 'home', moreOpen: false, mobileOpen: false,\n    probes: {}, qi: 0, answers: {}, multiSel: [],\n    roi: { q:25, d:1, f:10, s:22000 },\n  };\n\n  toTop() {\n    const de = document.documentElement;\n    const prev = de.style.scrollBehavior;\n    de.style.scrollBehavior = 'auto';\n    const jump = () => { window.scrollTo(0, 0); if (de              this.answer(q.id, val);\n            }\n          },\n        };\n      }),\n      next: () => this.answer(q.id, this.state.multiSel),\n      back: () => this.setState(s => ({ qi: Math.max(0, s.qi - 1), multiSel: [] })),\n\n      /* results */\n      resDate: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),\n      resScore: score, resPct: score + '%', resTint,\n      resHead: score <= 20 ? 'A tidy setup, with a few things worth closing.' : score <= 45 ? 'A working setup with real gaps in it.' : 'Several things here would hurt on the same bad day.',\n      resLine: findings.length\n        ? 'We found ' + findings.length + ' point' + (findings.length > 1 ? 's' : '') + ' worth attention, ordered by what would cost you most. Everything below came from your own answers — an engineer confirms or closes each one on your actual network.'\n        : 'Nothing in your answers raised a flag. That is unusual, and worth verifying on the real network rather than taking on trust.',\n      findings: findings.map((f, i) => {\n        const s = SEV[f.sev];\n        return { n: String(i + 1).padStart(2, '0'), title: f.title, why: f.why, fix: f.fix, tint: s.tint, ev: s.ev, chipBg: s.chipBg, chipBorder: s.chipBorder };\n      }),\n    };\n  }\n\n  answer(id, val) {\n    const st = this.state;\n    const answers = Object.assign({}, st.answers, { [id]: val });\n    if (st.qi >= this.questions().length - 1) this.setState({ answers, view: 'results', multiSel: [] }, () => this.toTop());\n    else this.setState({ answers, qi: st.qi + 1, multiSel: [] });\n  }\n\n  enq() {\n    const g = (k) => { const el = this.root && this.root.querySelector('[data-enq=\"' + k + '\"]'); return el ? el.value.trim() : ''; };\n    const err = this.root && this.root.querySelector('[data-enqerr]');\n    if (!g('name')) { if (err) err.style.display = 'block'; return null; }\n    if (err) err.style.display = 'none';\n    const L = ['Hello PureTechs — enquiry f
